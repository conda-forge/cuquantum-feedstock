# Require glibc 2.28 for all variants (including CUDA 12.x where the global
# pinning defaults to 2.17). Entries must mirror the global pinning selectors
# exactly to preserve zip_keys alignment.
# See: https://github.com/conda-forge/conda-smithy/issues/1950
# Working pattern from: https://github.com/conda-forge/nccl-feedstock/pull/154
c_stdlib_version:              # [linux]
  - 2.28                       # [linux]
  - 2.28                       # [linux and not ppc64le and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]


mpi:
  - nompi
  - openmpi

# This is to make sure "mpi" above is *NOT* used to compute the package hash. For the outputs
# with distributed interfaces ("cutensornet", "cudensitymat", "cupauliprop") the build string
# carries the MPI flavor explicitly because we want both flavors generated. But, for the
# "cuquantum" metapackage (and the other outputs) if the hashes were not colliding we'd also
# generate one package per "mpi" flavor, despite them having nothing to do with MPI. We better
# make sure we have colliding hashes, so that only 1 unique upload would be done by the CI.
ignore_version:
  - mpi